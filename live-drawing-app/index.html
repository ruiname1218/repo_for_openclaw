<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Live お絵かきアプリ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>🎨 Live お絵かき</h1>
      <div class="tools">
        <label>色 <input id="color" type="color" value="#111111" /></label>
        <label>太さ <input id="size" type="range" min="1" max="40" value="6" /></label>
        <span id="sizeVal">6px</span>
        <button id="eraser" type="button" aria-pressed="false">消しゴム OFF</button>
        <button id="undo" type="button">Undo</button>
        <button id="redo" type="button">Redo</button>
        <button id="clear" type="button">全消し</button>
        <button id="save" type="button">PNG保存</button>
      </div>
      <canvas id="canvas"></canvas>
    </main>
    <script src="app.js"></script>
  </body>
</html>
