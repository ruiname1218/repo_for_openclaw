<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>わくわく算数トレーニング</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header card">
      <h1>🌟 わくわく算数トレーニング</h1>
      <button id="themeToggle" class="ghost-btn" aria-label="ダークモード切替">🌙 ダークモード</button>
    </header>

    <section id="setup" class="card">
      <h2>スタート設定</h2>

      <div class="field">
        <label for="mode">モード</label>
        <select id="mode">
          <option value="add">たし算</option>
          <option value="sub">ひき算</option>
          <option value="mul">かけ算</option>
          <option value="div">わり算</option>
        </select>
      </div>

      <div class="field">
        <label for="difficulty">難易度</label>
        <select id="difficulty">
          <option value="easy">初級</option>
          <option value="medium">中級</option>
          <option value="hard">上級</option>
        </select>
      </div>

      <div class="stats-line">
        <span>🏆 ベストスコア: <strong id="bestScore">0 / 10</strong></span>
        <span>🔥 学習連続日数: <strong id="streak">0日</strong></span>
      </div>

      <button id="startBtn" class="primary-btn">10問チャレンジ開始</button>
    </section>

    <section id="quiz" class="card hidden">
      <div class="quiz-top">
        <p id="progress">1 / 10</p>
        <p id="timer">⏱ 00:00</p>
      </div>

      <h2 id="question">1 + 1 = ?</h2>
      <div class="answer-row">
        <input id="answerInput" type="number" inputmode="numeric" placeholder="答えを入力" />
        <button id="submitBtn" class="primary-btn">回答する</button>
      </div>

      <div id="feedback" class="feedback"></div>
      <button id="nextBtn" class="ghost-btn hidden">次の問題へ</button>
    </section>

    <section id="result" class="card hidden">
      <h2>🎉 おつかれさま！</h2>
      <p id="scoreText"></p>
      <p id="timeText"></p>
      <div id="weakStats" class="weak-stats"></div>
      <button id="retryBtn" class="primary-btn">もう一度チャレンジ</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
