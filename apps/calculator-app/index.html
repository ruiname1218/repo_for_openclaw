<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>電卓アプリ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>電卓</h1>
        <button id="themeToggle" class="toggle-btn" aria-label="ダークモード切替">🌙 ダーク</button>
      </header>

      <section class="calculator" aria-label="計算機">
        <div class="display-wrap">
          <div id="expression" class="expression" aria-live="polite">&nbsp;</div>
          <div id="display" class="display" aria-live="assertive">0</div>
        </div>

        <div class="keypad">
          <button data-action="ac" class="key key-func">AC</button>
          <button data-action="c" class="key key-func">C</button>
          <button data-action="backspace" class="key key-func">⌫</button>
          <button data-action="operator" data-value="/" class="key key-op">÷</button>

          <button data-action="digit" data-value="7" class="key">7</button>
          <button data-action="digit" data-value="8" class="key">8</button>
          <button data-action="digit" data-value="9" class="key">9</button>
          <button data-action="operator" data-value="*" class="key key-op">×</button>

          <button data-action="digit" data-value="4" class="key">4</button>
          <button data-action="digit" data-value="5" class="key">5</button>
          <button data-action="digit" data-value="6" class="key">6</button>
          <button data-action="operator" data-value="-" class="key key-op">−</button>

          <button data-action="digit" data-value="1" class="key">1</button>
          <button data-action="digit" data-value="2" class="key">2</button>
          <button data-action="digit" data-value="3" class="key">3</button>
          <button data-action="operator" data-value="+" class="key key-op">＋</button>

          <button data-action="sign" class="key key-func">+/-</button>
          <button data-action="percent" class="key key-func">%</button>
          <button data-action="decimal" class="key">.</button>
          <button data-action="equals" class="key key-eq">＝</button>
        </div>
      </section>

      <aside class="history-panel" aria-label="計算履歴">
        <div class="history-header">
          <h2>履歴</h2>
          <button id="clearHistory" class="toggle-btn small">履歴クリア</button>
        </div>
        <ul id="historyList" class="history-list"></ul>
      </aside>
    </main>

    <script src="script.js"></script>
  </body>
</html>
