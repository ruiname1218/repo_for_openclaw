<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2Dブロック崩し</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <h1>2D ブロック崩し</h1>
    <p class="hint">← → / A D で移動・Spaceで開始/再開・Rでリスタート</p>
    <div class="hud">
      <span>Score: <b id="score">0</b></span>
      <span>Lives: <b id="lives">3</b></span>
      <span>Level: <b id="level">1</b></span>
    </div>
    <canvas id="game" width="800" height="520" aria-label="block breaker game"></canvas>
    <div id="overlay" class="overlay">Spaceで開始</div>
  </main>
  <script src="script.js"></script>
</body>
</html>
