<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>家計簿トラッカー</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="container app-header">
      <h1>家計簿トラッカー</h1>
      <button id="themeToggle" class="btn btn-secondary" type="button">🌙 ダークモード</button>
    </header>

    <main class="container">
      <section class="card">
        <h2>収支を追加・編集</h2>
        <form id="entryForm" class="grid-form">
          <input type="hidden" id="entryId" />

          <label>
            種別
            <select id="type" required>
              <option value="expense">支出</option>
              <option value="income">収入</option>
            </select>
          </label>

          <label>
            日付
            <input id="date" type="date" required />
          </label>

          <label>
            カテゴリ
            <select id="category" required></select>
          </label>

          <label class="full">
            メモ
            <input id="memo" type="text" maxlength="120" placeholder="例: スーパーで買い物" />
          </label>

          <label>
            金額（円）
            <input id="amount" type="number" min="1" step="1" required />
          </label>

          <div class="form-actions full">
            <button id="saveBtn" class="btn" type="submit">追加</button>
            <button id="cancelEditBtn" class="btn btn-secondary" type="button" hidden>編集をキャンセル</button>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="toolbar">
          <h2>月次サマリー</h2>
          <label>
            対象月
            <input id="targetMonth" type="month" />
          </label>
        </div>

        <div class="summary-grid">
          <div class="summary-item income">
            <span>収入</span>
            <strong id="sumIncome">¥0</strong>
          </div>
          <div class="summary-item expense">
            <span>支出</span>
            <strong id="sumExpense">¥0</strong>
          </div>
          <div class="summary-item balance">
            <span>残高</span>
            <strong id="sumBalance">¥0</strong>
          </div>
        </div>

        <h3>支出カテゴリ内訳</h3>
        <ul id="breakdownList" class="breakdown"></ul>
      </section>

      <section class="card">
        <div class="toolbar wrap">
          <h2>明細一覧</h2>
          <div class="actions">
            <button id="exportCsvBtn" class="btn btn-secondary" type="button">CSVエクスポート</button>
            <label class="btn btn-secondary file-btn" for="importCsvInput">CSVインポート</label>
            <input id="importCsvInput" type="file" accept=".csv,text/csv" hidden />
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>日付</th>
                <th>種別</th>
                <th>カテゴリ</th>
                <th>メモ</th>
                <th class="num">金額</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="entryTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <template id="rowTemplate">
      <tr>
        <td data-k="date"></td>
        <td data-k="type"></td>
        <td data-k="category"></td>
        <td data-k="memo"></td>
        <td class="num" data-k="amount"></td>
        <td>
          <button class="btn btn-small edit">編集</button>
          <button class="btn btn-small btn-danger delete">削除</button>
        </td>
      </tr>
    </template>

    <script src="app.js"></script>
  </body>
</html>
