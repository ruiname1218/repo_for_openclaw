<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>History Sprint</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>📚 History Sprint</h1>
    <p class="sub">日本史・世界史のクイック学習アプリ</p>

    <section class="panel">
      <div class="controls">
        <label>ジャンル
          <select id="category">
            <option value="all">すべて</option>
            <option value="japan">日本史</option>
            <option value="world">世界史</option>
          </select>
        </label>
        <button id="startBtn">学習スタート</button>
      </div>

      <div id="quizArea" class="hidden">
        <div class="meta">
          <span id="progress">1 / 1</span>
          <span id="score">Score: 0</span>
        </div>
        <h2 id="question">問題</h2>
        <div id="choices" class="choices"></div>
        <p id="explain" class="explain"></p>
        <button id="nextBtn" class="hidden">次へ</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
