<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>お絵描きアプリ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>🎨 お絵描きアプリ</h1>

      <section class="toolbar" aria-label="描画ツール">
        <label>
          色
          <input type="color" id="colorPicker" value="#111111" />
        </label>

        <label>
          太さ
          <input type="range" id="brushSize" min="1" max="40" value="6" />
          <span id="brushSizeValue">6px</span>
        </label>

        <button id="eraserBtn" type="button" aria-pressed="false">消しゴム OFF</button>
        <button id="undoBtn" type="button">元に戻す</button>
        <button id="redoBtn" type="button">やり直し</button>
        <button id="clearBtn" type="button" class="danger">全消し</button>
        <button id="downloadBtn" type="button">PNG保存</button>
      </section>

      <section class="canvas-wrap">
        <canvas id="drawingCanvas" aria-label="お絵描きキャンバス"></canvas>
      </section>

      <p class="hint">マウス・タッチ両対応 / Undo・Redoは最大20ステップ</p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
